<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>对话项目归档 · 管理台</title>
<style>
  :root {
    --bg: #0f1115; --panel: #191c22; --panel2: #22262e; --line: #303540;
    --text: #e6e8ec; --muted: #9aa2b1; --accent: #5b9cff; --danger: #e05b5b;
    --ok: #4caf82; --warn: #e0a94c;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; }
  button, input, textarea { font: inherit; }
  a { color: var(--accent); text-decoration: none; }
  .hidden { display: none !important; }

  /* 登录 */
  #login { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .login-card { width: 360px; background: var(--panel); border: 1px solid var(--line);
                border-radius: 12px; padding: 32px; }
  .login-card h1 { margin: 0 0 6px; font-size: 20px; }
  .login-card p { color: var(--muted); margin: 0 0 20px; font-size: 13px; }
  input[type=password], input[type=text], textarea {
    width: 100%; background: var(--panel2); color: var(--text);
    border: 1px solid var(--line); border-radius: 6px; padding: 9px 12px; outline: none; }
  input:focus, textarea:focus { border-color: var(--accent); }
  .btn { background: var(--accent); color: #fff; border: 0; border-radius: 6px;
         padding: 9px 16px; cursor: pointer; }
  .btn:hover { filter: brightness(1.1); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn.ghost { background: var(--panel2); border: 1px solid var(--line); color: var(--text); }
  .btn.danger { background: var(--danger); }
  .btn.sm { padding: 4px 10px; font-size: 12px; }
  #login .btn { width: 100%; margin-top: 16px; }
  .err { color: var(--danger); font-size: 13px; min-height: 20px; margin-top: 8px; }

  /* 主界面 */
  header { display: flex; align-items: center; gap: 12px; padding: 14px 22px;
           border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { margin: 0; font-size: 16px; flex: 1; }
  header .stat { color: var(--muted); font-size: 12px; }
  main { padding: 18px 22px; }
  .toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
  .toolbar input[type=text] { width: 280px; }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .seg button { background: var(--panel2); color: var(--muted); border: 0;
                padding: 8px 14px; cursor: pointer; }
  .seg button.on { background: var(--accent); color: #fff; }

  table { width: 100%; border-collapse: collapse; background: var(--panel);
          border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  th, td { padding: 9px 12px; text-align: left; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 500; font-size: 12px; background: var(--panel2); }
  tr:last-child td { border-bottom: 0; }
  tr:hover td { background: #1d2129; }
  .name { font-weight: 600; cursor: pointer; }
  .tag { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 4px;
         margin-left: 6px; border: 1px solid var(--line); color: var(--muted); }
  .tag.pin { color: var(--warn); border-color: var(--warn); }
  .tag.off { color: var(--muted); }
  .tag.manual { color: var(--ok); border-color: var(--ok); }
  .actions { display: flex; gap: 5px; flex-wrap: wrap; }
  .muted { color: var(--muted); font-size: 12px; }

  /* 详情抽屉 */
  #mask { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 10; }
  #drawer { position: fixed; top: 0; right: 0; width: min(640px, 94vw); height: 100vh;
            background: var(--panel); border-left: 1px solid var(--line); z-index: 11;
            padding: 24px; overflow: auto; }
  #drawer h2 { margin: 0 0 4px; font-size: 19px; }
  #drawer .close { float: right; }
  .kv { display: grid; grid-template-columns: 100px 1fr; gap: 6px 12px;
        margin: 18px 0; font-size: 13px; }
  .kv dt { color: var(--muted); }
  .kv dd { margin: 0; word-break: break-all; }
  .sec { margin-top: 20px; }
  .sec h3 { font-size: 13px; color: var(--muted); margin: 0 0 8px;
            border-bottom: 1px solid var(--line); padding-bottom: 6px; }
  textarea { min-height: 70px; resize: vertical; }
  .row { display: flex; gap: 8px; align-items: center; margin: 8px 0; }
  .row input[type=text] { flex: 1; }
  ul.files { columns: 2; padding-left: 18px; margin: 0; font-size: 12px; color: var(--muted); }
  #toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
           background: var(--panel2); border: 1px solid var(--line); padding: 10px 18px;
           border-radius: 8px; z-index: 20; display: none; }
</style>
</head>
<body>

<div id="login">
  <div class="login-card">
    <h1>对话项目归档 · 管理台</h1>
    <p>仅限本机访问。输入口令以管理已监测的项目列表。</p>
    <input type="password" id="pw" placeholder="口令" autocomplete="current-password">
    <button class="btn" id="loginBtn">登录</button>
    <div class="err" id="loginErr"></div>
  </div>
</div>

<div id="app" class="hidden">
  <header>
    <h1>🗂️ 对话项目归档 · 管理台</h1>
    <span class="stat" id="stat"></span>
    <button class="btn ghost sm" id="logoutBtn">退出</button>
  </header>
  <main>
    <div class="toolbar">
      <input type="text" id="q" placeholder="搜索项目名 / 目录 / 语言…">
      <div class="seg">
        <button id="tabWatch" class="on">关注中</button>
        <button id="tabAll">全部</button>
      </div>
      <button class="btn ghost sm" id="refreshBtn">刷新</button>
    </div>
    <table>
      <thead><tr>
        <th style="width:32%">项目</th><th>类型</th><th>语言</th>
        <th>最后开发</th><th>会话/文件</th><th>操作</th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <p class="muted" id="hint"></p>
  </main>
</div>

<div id="mask" class="hidden"></div>
<div id="drawer" class="hidden">
  <button class="btn ghost sm close" id="closeBtn">关闭</button>
  <h2 id="dName"></h2>
  <div class="muted" id="dDir"></div>
  <dl class="kv" id="dKv"></dl>
  <div class="sec">
    <h3>用途</h3>
    <div id="dPurpose"></div>
  </div>
  <div class="sec">
    <h3>人工备注（保存后生效）</h3>
    <textarea id="dNote" placeholder="给未来的自己留一句…"></textarea>
    <button class="btn sm" id="saveNote">保存备注</button>
  </div>
  <div class="sec">
    <h3>改名（只改显示名，目录不变）</h3>
    <div class="row">
      <input type="text" id="dNewName" placeholder="新的项目名称">
      <button class="btn sm" id="renameBtn">改名</button>
    </div>
  </div>
  <div class="sec">
    <h3>改目录名（独立入口，显示名不变）</h3>
    <div class="row">
      <input type="text" id="dNewDir" placeholder="新的目录名">
      <button class="btn ghost sm" id="renameDirBtn">改目录名</button>
    </div>
    <p class="muted">目录改名会改变归档路径；历史链接可能失效，请谨慎。</p>
  </div>
  <div class="sec">
    <h3>原始对话</h3>
    <div id="dLinks"></div>
  </div>
  <div class="sec">
    <h3>源码文件（前 200）</h3>
    <ul class="files" id="dFiles"></ul>
  </div>
  <div class="sec">
    <h3>危险操作</h3>
    <button class="btn danger sm" id="deleteBtn">停止归档并移入 _trash</button>
  </div>
</div>

<div id="toast"></div>

<script>
let csrf = '';
let projects = [];
let mode = 'watch';   // watch | all
let curKey = '';

const $ = id => document.getElementById(id);
function toast(msg) {
  $('toast').textContent = msg;
  $('toast').style.display = 'block';
  clearTimeout(toast.t);
  toast.t = setTimeout(() => $('toast').style.display = 'none', 2600);
}
async function api(path, opts = {}) {
  opts.headers = Object.assign({'Content-Type': 'application/json'}, opts.headers || {});
  if (csrf) opts.headers['X-CSRF-Token'] = csrf;
  const r = await fetch(path, opts);
  let d = {};
  try { d = await r.json(); } catch (e) {}
  if (r.status === 401 && path !== '/api/login') {
    showLogin(); toast('登录已过期，请重新登录');
  }
  return d;
}
function post(path, body) {
  return api(path, {method: 'POST', body: JSON.stringify(body || {})});
}

function showLogin() {
  $('login').classList.remove('hidden');
  $('app').classList.add('hidden');
  $('drawer').classList.add('hidden');
  $('mask').classList.add('hidden');
}
function showApp() {
  $('login').classList.add('hidden');
  $('app').classList.remove('hidden');
}

$('loginBtn').onclick = async () => {
  $('loginErr').textContent = '';
  const r = await post('/api/login', {password: $('pw').value});
  if (r.ok) {
    csrf = r.csrf; $('pw').value = ''; showApp(); await load();
  } else {
    $('loginErr').textContent = r.error || '登录失败';
  }
};
$('pw').onkeydown = e => { if (e.key === 'Enter') $('loginBtn').click(); };
$('logoutBtn').onclick = async () => {
  await post('/api/logout', {}); csrf = ''; projects = []; showLogin();
};
$('refreshBtn').onclick = load;
$('q').oninput = renderRows;
$('tabWatch').onclick = () => { mode = 'watch'; syncTabs(); renderRows(); };
$('tabAll').onclick = () => { mode = 'all'; syncTabs(); renderRows(); };
function syncTabs() {
  $('tabWatch').classList.toggle('on', mode === 'watch');
  $('tabAll').classList.toggle('on', mode === 'all');
}

async function load() {
  const r = await api('/api/projects');
  if (!r.ok) return;
  projects = r.data;
  const watch = projects.filter(p => p.watching && !p.skip).length;
  $('stat').textContent = `共 ${projects.length} 项 · 关注中 ${watch} · 已归档 ${projects.filter(p=>p.archived).length}`;
  renderRows();
}

function renderRows() {
  const q = $('q').value.trim().toLowerCase();
  const list = projects.filter(p => {
    if (mode === 'watch' && (!p.watching || p.skip)) return false;
    if (!q) return true;
    return (p.name + ' ' + p.dir + ' ' + p.language + ' ' + p.purpose).toLowerCase().includes(q);
  });
  $('hint').textContent = `显示 ${list.length} / ${projects.length} 项`
    + (mode === 'watch' ? '（点「全部」可查看已取消关注的项目）' : '（含已取消关注）');
  $('rows').innerHTML = list.map(p => `
    <tr>
      <td><span class="name" onclick="detail('${encodeURIComponent(p.key)}')">${esc(p.name)}</span>
        ${p.pinned ? '<span class="tag pin">📌置顶</span>' : ''}
        ${!p.watching ? '<span class="tag off">已取消关注</span>' : ''}
        ${p.skip ? '<span class="tag off">已停止归档</span>' : ''}
        ${p.manual ? '<span class="tag manual">人工命名</span>' : ''}
      </td>
      <td>${esc(p.type)}</td>
      <td>${esc(p.language)}</td>
      <td>${esc(p.last_dev)}</td>
      <td>${p.sessions} / ${p.files}</td>
      <td class="actions">
        <button class="btn ghost sm" onclick="pin('${encodeURIComponent(p.key)}',${!p.pinned})">${p.pinned ? '取消置顶' : '置顶'}</button>
        <button class="btn ghost sm" onclick="watch('${encodeURIComponent(p.key)}',${!p.watching})">${p.watching ? '取消关注' : '恢复关注'}</button>
        <button class="btn ghost sm" onclick="detail('${encodeURIComponent(p.key)}')">详情</button>
      </td>
    </tr>`).join('');
}
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

async function pin(key, val) {
  const r = await post('/api/pin', {key: decodeURIComponent(key), pinned: val});
  if (r.ok) { toast(val ? '已置顶' : '已取消置顶'); await load(); } else toast(r.error);
}
async function watch(key, val) {
  const r = await post('/api/watch', {key: decodeURIComponent(key), watching: val});
  if (r.ok) { toast(val ? '已恢复关注' : '已取消关注（归档保留）'); await load(); } else toast(r.error);
}

async function detail(key) {
  key = decodeURIComponent(key);
  const r = await api('/api/detail?key=' + encodeURIComponent(key));
  if (!r.ok) return toast(r.error);
  const d = r.data;
  curKey = key;
  $('dName').textContent = d.name;
  $('dDir').textContent = '归档目录：' + d.dir;
  $('dKv').innerHTML = [
    ['类型', d.type], ['开发语言', d.language_full], ['首次开发', d.first_dev],
    ['最后开发', d.last_dev], ['最后归档', d.last_archived],
    ['会话 / 文件', `${d.sessions} / ${d.files}`],
    ['原文件体积', d.bytes ? (d.bytes/1048576).toFixed(1) + ' MB' : '—'],
    ['状态', d.status + (d.archived ? ' · 已归档' : ' · 未归档')],
    ['独立 git', d.git_repo ? '是' : '否'],
    ['原目录名', d.renamed_from || '—']
  ].map(([k,v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('');
  $('dPurpose').textContent = d.purpose || d.summary || '（无摘要）';
  $('dNote').value = d.note || '';
  $('dNewName').value = d.name;
  $('dNewDir').value = d.dir;
  $('dLinks').innerHTML = d.conversations.length
    ? d.conversations.map(c => `<div>${esc(c.time)} · ${esc(c.title || '未命名会话')}
        ${c.link ? ` · <a href="${esc(c.link)}">打开原对话</a>` : ''}</div>`).join('')
    : '（无会话记录）';
  $('dFiles').innerHTML = d.source_files.map(f => `<li>${esc(f)}</li>`).join('');
  $('drawer').classList.remove('hidden');
  $('mask').classList.remove('hidden');
}
function closeDetail() {
  $('drawer').classList.add('hidden'); $('mask').classList.add('hidden'); curKey = '';
}
$('closeBtn').onclick = closeDetail;
$('mask').onclick = closeDetail;

$('saveNote').onclick = async () => {
  const r = await post('/api/note', {key: curKey, note: $('dNote').value});
  toast(r.ok ? '备注已保存' : r.error); if (r.ok) await load();
};
$('renameBtn').onclick = async () => {
  const title = $('dNewName').value.trim();
  if (!title) return toast('项目名不能为空');
  const r = await post('/api/rename', {key: curKey, title});
  if (r.ok) { toast('显示名已更新，目录未变'); await load(); await detail(curKey); }
  else toast(r.error);
};
$('renameDirBtn').onclick = async () => {
  const dirname = $('dNewDir').value.trim();
  if (!dirname) return toast('目录名不能为空');
  if (!confirm('确定修改归档目录名？此操作可通过备份回滚，但历史链接可能失效。')) return;
  const r = await post('/api/rename-dir', {key: curKey, dirname});
  if (r.ok) { toast('目录名已更新，显示名未变'); await load(); await detail(curKey); }
  else toast(r.error);
};
$('deleteBtn').onclick = async () => {
  if (!confirm('确定停止归档并把目录移入 _trash？此为软删除，可手工找回。')) return;
  const r = await post('/api/delete', {key: curKey, purge: false});
  if (r.ok) { toast('已停止归档并移入 _trash'); closeDetail(); await load(); }
  else toast(r.error);
};

// 启动时探测已有会话
(async () => {
  const r = await api('/api/session');
  if (r.ok) { csrf = r.csrf; showApp(); await load(); }
  else showLogin();
})();
</script>
</body>
</html>
